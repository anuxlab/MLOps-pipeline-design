project:
  name: github-mlops-laboratory
  phase: phase-3-continuous-training

data:
  task: classification
  n_samples: 3000
  n_features: 20
  n_informative: 12
  n_redundant: 4
  n_classes: 2
  class_sep: 1.0
  flip_y: 0.02
  random_state: 42
  reference_seed: 42
  current_seed: 43
  evaluation_seed: 2026
  reference_eval_seed: 2025
  test_size: 0.25
  covariate_shift: 1.5

model:
  name: logistic_regression
  max_iter: 1000
  C: 1.0
  solver: lbfgs
  random_state: 42

ct:
  min_samples: 100
  drift_alpha: 0.01
  min_drifted_fraction: 0.30
  minimum_baseline_accuracy: 0.70
  minimum_candidate_accuracy: 0.70
  minimum_accuracy_improvement: 0.02

execution:
  run_name: phase3-continuous-training
  output_dir: artifacts/ct-runs
