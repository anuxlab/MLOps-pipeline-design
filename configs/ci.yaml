project:
  name: github-mlops-laboratory
  phase: phase-2-continuous-integration

data:
  task: classification
  n_samples: 2500
  n_features: 20
  n_informative: 12
  n_redundant: 4
  n_classes: 2
  class_sep: 1.0
  flip_y: 0.02
  random_state: 42
  test_size: 0.25

model:
  name: logistic_regression
  max_iter: 1000
  C: 1.0
  solver: lbfgs
  random_state: 42

ci:
  min_samples: 100
  quality_gates:
    accuracy: 0.70
    roc_auc: 0.75

execution:
  run_name: phase2-ci-classification
  output_dir: artifacts/ci-runs
