[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-mlops-laboratory"
version = "0.1.0"
description = "A reproducible MLOps CI/CD/CT simulation on GitHub Actions runners"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.10,<2",
  "joblib>=1.3,<2",
  "PyYAML>=6,<7",
  "psutil>=5.9,<8"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mlops-lab = "mlops_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
