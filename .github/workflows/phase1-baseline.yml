name: Phase 1 - Baseline ML

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: "Path to the baseline YAML configuration"
        required: true
        default: "configs/baseline.yaml"
        type: string

permissions:
  contents: read

concurrency:
  group: phase1-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Test and train baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: pytest -q

      - name: Run baseline training
        run: |
          python -m mlops_lab.cli run-baseline             --config "${{ inputs.config_path }}"             --output-dir artifacts/runs

      - name: Upload baseline run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runs/
          if-no-files-found: warn
          retention-days: 14
