name: Phase 3 - Continuous Training

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Controlled data scenario for CT simulation"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - covariate_shift
          - concept_drift
          - corrupted_data
  workflow_call:
    inputs:
      scenario:
        description: "Controlled data scenario for CT simulation"
        required: false
        default: stable
        type: string

permissions:
  contents: read

concurrency:
  group: phase3-ct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  continuous-training:
    name: Drift detection and conditional retraining
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Execute continuous training pipeline
        id: ct
        env:
          CT_SCENARIO: ${{ inputs.scenario || 'stable' }}
        shell: bash
        run: |
          set +e
          python -m mlops_lab.cli run-ct --config configs/ct.yaml --output-dir artifacts/ct-runs --scenario "$CT_SCENARIO"
          ct_exit_code=$?
          set -e

          mapfile -t reports < <(find artifacts/ct-runs -type f -name ct_report.json)
          if [ "${#reports[@]}" -ne 1 ]; then
            echo "Expected exactly one CT report; found ${#reports[@]}."
            exit 1
          fi
          run_dir="$(dirname "${reports[0]}")"
          promoted="$(python -c 'import json,sys; r=json.load(open(sys.argv[1])); print(str(bool(r.get("candidate",{}).get("promoted"))).lower())' "${reports[0]}")"

          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          echo "candidate_promoted=$promoted" >> "$GITHUB_OUTPUT"
          echo "scenario=$CT_SCENARIO" >> "$GITHUB_OUTPUT"
          echo "Candidate promoted: $promoted"
          exit "$ct_exit_code"

      - name: Upload CT diagnostics
        if: always() && steps.ct.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase3-ct-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.ct.outputs.run_dir }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload deployable promoted candidate
        if: success() && steps.ct.outputs.candidate_promoted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase3-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.ct.outputs.run_dir }}/candidate_model.joblib
            ${{ steps.ct.outputs.run_dir }}/ct_report.json
            ${{ steps.ct.outputs.run_dir }}/model_manifest.json
          if-no-files-found: error
          retention-days: 30
