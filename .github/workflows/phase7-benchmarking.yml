name: Phase 7 - MLOps Benchmarking and Experiments

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Registry environment used for monitoring experiments"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      repeats:
        description: "Repetitions per experiment (1-5)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
      include_negative_tests:
        description: "Include expected-failure robustness experiments"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: phase7-benchmarking-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark CI, CT and monitoring scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run test suite
        run: python -m pytest -q

      - name: Discover latest Phase 5 registry
        id: registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: main
        run: python scripts/discover_registry.py

      - name: Download Phase 5 registry
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.registry.outputs.artifact_name }}
          run-id: ${{ steps.registry.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: model_registry

      - name: Run repeatable benchmark suite
        run: |
          python scripts/run_benchmarks.py --registry-dir model_registry --environment "${{ inputs.environment }}" --output-dir artifacts/benchmark-runs --repeats "${{ inputs.repeats }}" ${{ inputs.include_negative_tests && '--include-negative-tests' || '' }}

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/benchmark-runs/
          if-no-files-found: warn
          retention-days: 90
